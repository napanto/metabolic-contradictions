[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "metabolic-contradictions"
version = "0.1.0"
description = "Context-aware inconsistency mining in metabolic literature"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4.25,<5",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "torch>=2.9,<2.10",
  "transformers>=4.57,<5",
  "sentencepiece>=0.2,<0.3",
  "faiss-cpu>=1.12,<2",
  "rank-bm25>=0.2.2,<0.3",
  "networkx>=3.5,<4",
  "matplotlib>=3.10,<4",
  "safetensors>=0.6,<1",
  "orjson>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
